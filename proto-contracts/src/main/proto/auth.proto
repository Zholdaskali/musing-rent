syntax = "proto3";

import "google/protobuf/timestamp.proto";

option java_package = "kz.musin.proto.auth";
option java_multiple_files = true;

// 1 - service Авторизации ----------------
service AuthService {
  rpc ValidateToken (TokenRequest) returns (TokenResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}



// 2 - gRPC dto ValidateToken() ----------------
message TokenRequest {
  string token = 1;
}

message TokenResponse {
  bool valid = 1;
  string userId = 2;
}



// 3 - gRPC dto Sign-up() ----------------
message RegisterRequest {
  string userName = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string userId = 1;
}



// 4 - gRPC dto Sign-in() ----------------
message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
  UserData data = 3;
}

// возвращаемые данные после логина
message UserData {
  string userName = 1;
  string email = 2;
  google.protobuf.Timestamp create_at = 3;
  google.protobuf.Timestamp update_at = 4;
  UserRoles roles = 5; // роли ->
}

// -> роли списком могут быть комбинированные то есть покупатель и продавец
message UserRoles {
  repeated string name = 1;
}